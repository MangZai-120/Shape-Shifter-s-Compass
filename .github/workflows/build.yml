name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: Gradle 构建打包
        run: ./gradlew build --no-daemon --stacktrace

      - name: 上传构建产物（jar，排除 sources）
        uses: actions/upload-artifact@v4
        with:
          name: shape-shifter-s-compass-1.21.1-fabric-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
