# push（git 提交推送）或 PR 时自动构建打包；也可在 Actions 页面手动触发。
# 说明：build.gradle 会从项目外的 ../ssca_wiki/docs 打包 wiki 知识库；
#       若该目录不在仓库内（纯 Compass 仓库），Gradle 会自动跳过，不影响出 jar，
#       项目内 src/main/resources/.../knowledge/core 下的知识库（含 commands/forms）照常打包。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: Gradle 构建打包
        run: ./gradlew build --no-daemon --stacktrace

      - name: 上传构建产物（jar，排除 sources）
        uses: actions/upload-artifact@v4
        with:
          name: shape-shifter-s-compass-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
