plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        defaultRefmapName = "ssc_compass.refmap.json"
    }
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    // Unversioned 1.10.x / beta.2 mirrors must not override verified snapshots.
    exclude 'assets/ssc_compass/knowledge/ssc-wiki.md'
    exclude 'assets/ssc_compass/knowledge/mcmod-wiki.md'
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('compassRegressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mangzai.shapeshiftercompass.tools.CompassRegressionTest'
    workingDir = projectDir
}
check.dependsOn compassRegressionTest
tasks.register('compassFeatureTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mangzai.shapeshiftercompass.tools.FeatureRegressionTest'
    workingDir = layout.buildDirectory.dir('feature-regression').get().asFile
    systemProperty 'fabric.development', 'true'
    systemProperty 'fabric.remapClasspathFile', file('.gradle/loom-cache/remapClasspath.txt').absolutePath
    systemProperty 'fabric.classPathGroups', (sourceSets.main.output.files + sourceSets.test.output.files).collect { it.absolutePath }.join(File.pathSeparator)
    doFirst {
        workingDir.mkdirs()
        def cpFile = new File(workingDir, 'test-classpath.txt')
        cpFile.setText(classpath.asPath, 'UTF-8')
        systemProperty 'compass.testClasspath', cpFile.absolutePath
    }
}
check.dependsOn compassFeatureTest

jar {
    from('THIRD_PARTY.md')
    from('LICENSE') { rename { 'LICENSE_ssc_compass' } }
}
